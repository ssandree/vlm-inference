<!doctype html><html lang="ko"><meta charset="utf-8"><title>59영상 검토 체크리스트</title>
<style>body{font:15px system-ui;max-width:1200px;margin:24px auto;padding:0 16px;color:#182636}header{position:sticky;top:0;background:#fff;padding:12px;border-bottom:2px solid #345;z-index:1}button,select,input{padding:6px;margin:4px}article{border:1px solid #bcc8d2;border-radius:8px;padding:12px;margin:12px 0}textarea{width:96%;min-height:52px}blockquote{white-space:pre-wrap;border-left:3px solid #abc;padding-left:12px}details{margin:8px 0}small{color:#526170}.high{border-left:5px solid #bd8a14}pre{white-space:pre-wrap}.yes{background:#ecf8ee}.no{background:#fff0ee}</style>
<h1>59영상 검토 체크리스트</h1><p>직접 영상을 보고 yes/no/unsure로 판정하세요. GT 비지원은 확정 환각이 아닙니다. 동작 사실과 방향·색·인원·서사 오류는 나누어 메모하세요. 초기값은 모두 unsure입니다. 서버 파일이나 GT는 변경되지 않습니다.</p>
<header><select id="video"></select><select id="priority"><option value="all">전체 우선순위</option><option value="high">high만</option></select><button id="export">JSON 내보내기</button><label>가져오기 <input type="file" id="import" accept="application/json"></label><div id="status"></div></header><main id="main"></main>
<script id="data" type="application/json">__PAYLOAD__</script><script>
'use strict';const data=JSON.parse(document.getElementById('data').textContent),key='virat-59-8b-fp16-original-gt-review-v1';
let answers={},extra={};const fields=['answer','start_sec','end_sec','actor_id','existing_gt_id','same_event_as','correction_ko'];
function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function status(msg=''){const n=Object.values(answers).filter(x=>x.answer==='yes'||x.answer==='no').length;document.getElementById('status').textContent=`${n} / ${data.items.length} 항목 yes/no · ${msg}`}
function save(){try{localStorage.setItem(key,JSON.stringify({answers,extra}));status('로컬 임시 저장됨. JSON으로 백업하세요.')}catch(e){status('로컬 저장 불가. JSON 내보내기를 사용하세요.')}}
function accept(obj){if(!obj||typeof obj!=='object')throw Error('잘못된 JSON');const incoming=obj.answers||{};for(const item of data.items){const a=incoming[item.review_id];if(!a)continue;if(!['yes','no','unsure'].includes(a.answer))throw Error('잘못된 answer');answers[item.review_id]=Object.fromEntries(fields.map(k=>[k,String(a[k]??'')]));}extra=obj.extra&&typeof obj.extra==='object'?obj.extra:{};}
try{const saved=localStorage.getItem(key);if(saved)accept(JSON.parse(saved))}catch(e){status('저장 답변을 읽지 못했습니다.')}
const sel=document.getElementById('video');for(const [v,c] of Object.entries(data.context)){const o=el('option',`${v} [${c.gt_status}]`);o.value=v;sel.append(o)}
function render(){const v=sel.value,main=document.getElementById('main');main.replaceChildren();const c=data.context[v];main.append(el('h2',v));const caps=el('details');caps.append(el('summary','두 조건의 전체 원문 보기'));for(const r of c.captions){caps.append(el('h3',r.record_id+' '+r.condition),el('p',r.description))}main.append(caps);
 for(const it of data.items.filter(x=>x.video_id===v&&(document.getElementById('priority').value==='all'||x.priority==='high'))){const a=answers[it.review_id]||Object.fromEntries(fields.map(k=>[k,k==='answer'?'unsure':'']));const card=el('article');card.className=it.priority+' '+a.answer;card.append(el('small',`${it.review_id} · ${it.priority} · ${it.kind}`),el('h3',it.question_ko),el('p',it.check_point_ko));const choose=el('select');for(const x of ['unsure','yes','no']){const o=el('option',x);o.value=x;choose.append(o)}choose.value=a.answer;choose.onchange=()=>{a.answer=choose.value;answers[it.review_id]=a;card.className=it.priority+' '+a.answer;save()};card.append(choose);
 const source=el('details');source.append(el('summary','원문 및 GT 참조 확인'));for(const s of it.sources){source.append(el('small',`${s.record_id} / ${s.condition} / ${s.label}`));if(s.evidence)source.append(el('blockquote',s.evidence))}if(it.gt_refs.length)source.append(el('pre',JSON.stringify(it.gt_refs,null,2)));card.append(source);
 for(const [k,label] of [['start_sec','시작 초'],['end_sec','종료 초'],['actor_id','주체'],['existing_gt_id','CE ID'],['same_event_as','같은 사건 ID']]){const l=el('label',label);const inp=el('input');inp.size=12;inp.value=a[k]||'';inp.oninput=()=>{a[k]=inp.value;answers[it.review_id]=a;save()};l.append(inp);card.append(l)}const note=el('textarea');note.placeholder='실제 행동/방향, 속성 오류, 정정 및 불확실 이유';note.value=a.correction_ko||'';note.oninput=()=>{a.correction_ko=note.value;answers[it.review_id]=a;save()};card.append(note);main.append(card)}
 main.append(el('h3','목록 밖 추가 사건'));const more=el('textarea');more.placeholder='행동 / 시작·끝(초) / 주체 / 방향 / 기존 사건과 중복 여부';more.value=extra[v]||'';more.oninput=()=>{extra[v]=more.value;save()};main.append(more);status();}
sel.onchange=render;document.getElementById('priority').onchange=render;
document.getElementById('export').onclick=()=>{const all={};for(const i of data.items)all[i.review_id]=answers[i.review_id]||Object.fromEntries(fields.map(k=>[k,k==='answer'?'unsure':'']));const out={schema:key,exported_at:new Date().toISOString(),answers:all,extra};const url=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='review_answers_59_8b_fp16.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('import').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(obj.schema!==key)throw Error('다른 검토표의 JSON입니다.');accept(obj);save();render()}catch(err){status('가져오기 실패: '+err.message)}};render();
</script></html>
