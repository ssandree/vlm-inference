# 11 VIRAT clips x 5 Qwen3-VL presets x 2 conditions.
# full_frame: 1 fps full-scene video.
# motion_roi: proposed ROI packing. Each tube is one [Global] frame at the
# ROI start, then that tube's 1 fps ROI video. Prompt: frames_roi_per_tube.txt.
# Does not start from outputs/fullframe_motion_roi_11.

model: 8b

models:
  - 8b
  - 8b-int8
  - 8b-fp8
  - 30b
  - 30b-fp8

videos:
  - VIRAT_S_010114_01_000235_000311
  - VIRAT_S_010207_04_000929_000954
  - VIRAT_S_000200_00_000100_000171
  - VIRAT_S_010001_03_000537_000563
  - VIRAT_S_010003_03_000219_000259
  - VIRAT_S_010003_10_000901_000934
  - VIRAT_S_010003_06_000526_000560
  - VIRAT_S_010106_02_000656_000692
  - VIRAT_S_010113_05_000776_000805
  - VIRAT_S_040000_01_000042_000099
  - VIRAT_S_040005_08_001225_001276

conditions:
  - full_frame
  - full_frame_2fps
  - motion_roi

prompts:
  full_frame: prompts/frames_full.txt
  full_frame_2fps: prompts/frames_full.txt
  motion_roi: prompts/frames_roi_per_tube.txt

generation:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.2

video:
  fps: 1.0
  min_pixels: 4096
  max_pixels: 262144
  total_pixels: 20971520

image:
  min_pixels: 4096
  max_pixels: 262144

mode: default

output:
  dir: outputs/fullframe_proposed_roi_5model
  file: results.json
