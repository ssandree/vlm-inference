# Swap VLM: 8b | 30b | 8b-fp8 | 30b-fp8  (see configs/models.yaml)
# Or keep a path mapping: {path, dtype, device_map, attn_implementation}
model: 8b

generation:
  max_new_tokens: 384
  do_sample: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.1

# Video / frame preprocessing options passed into Qwen3-VL message content
video:
  fps: 2.0
  # nframes: 32          # mutually exclusive with fps when set
  min_pixels: 4096       # 4 * 32 * 32
  max_pixels: 262144     # 256 * 32 * 32
  total_pixels: 20971520 # 20480 * 32 * 32

image:
  min_pixels: 4096
  max_pixels: 262144

# Inference mode:
#   default    - frames folder = one video sequence (current behavior)
#   experiment - each frame is an image with a [Global]/ROI] t=... text label
mode: experiment

# Filename patterns for experiment mode (Python regex on file stem, named groups)
experiment:
  global_pattern: 'global_frame_(?P<frame>\d+)_t(?P<time>\d+(?:\.\d+)?)'
  roi_pattern: 'tube(?P<roi>\d+)_frame_(?P<frame>\d+)_t(?P<time>\d+(?:\.\d+)?)'
  global_label: '[Global] t={time}s'
  roi_label: '[ROI{roi}] t={time}s'

# Global default prompt (job-level prompt / prompt_file overrides this)
prompt_file: prompts/frames.txt

output:
  dir: outputs
  file: results.json

# Fill in real paths before running. 
