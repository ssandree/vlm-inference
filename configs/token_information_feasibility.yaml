# Run from repository root; independent full-frame images, never ROI crops.
# Frame↔event matching lives in token_information.frame_event_map so it can
# be edited without guessing. Each frame is scored alone, using only the
# event sentences listed in matched_event_ids.
model:
  name: 8b
  device_map: cuda:0
mode: experiment
image:
  min_pixels: 4096
  # Preserve full-frame resolution except Qwen's ordinary 32px alignment.
  max_pixels: 2097152
prompt_file: prompts/frames_roi.txt
output:
  dir: outputs/token_information_feasibility
  file: results.json
experiment:
  input_order: timestamp
token_information:
  video_id: VIRAT_S_000201_06_001354_001397
  frame_event_map: configs/token_information_frame_event_map.yaml
  gt_reference_file: configs/caption_refs_en_event_complete.json
  gt_reference_index: 0
  layers: [0, 4, 8]
  batch_size: 8
  validation_atol: 0.03
  roi:
    tracks_file: /home/ssandree/motion-detector/outputs/stage3/3_roi_tube/vlm_9vid_tg0.35_tm0.35/VIRAT_S_000201_06_001354_001397_roi_tracks.json
    tube_ids: [1]
# Required by the shared config loader; analysis reads frames from the map file.
jobs:
  - name: token_information
    type: images
    paths:
      - /data/datasets/fps_sampling_frames/fps_1/VIRAT_S_000201_06_001354_001397/global_frame_000004_t03.0.jpg
      - /data/datasets/fps_sampling_frames/fps_1/VIRAT_S_000201_06_001354_001397/global_frame_000011_t10.0.jpg
      - /data/datasets/fps_sampling_frames/fps_1/VIRAT_S_000201_06_001354_001397/global_frame_000016_t15.0.jpg
      - /data/datasets/fps_sampling_frames/fps_1/VIRAT_S_000201_06_001354_001397/global_frame_000019_t18.0.jpg
      - /data/datasets/fps_sampling_frames/fps_1/VIRAT_S_000201_06_001354_001397/global_frame_000021_t20.0.jpg
      - /data/datasets/fps_sampling_frames/fps_1/VIRAT_S_000201_06_001354_001397/global_frame_000024_t23.0.jpg
      - /data/datasets/fps_sampling_frames/fps_1/VIRAT_S_000201_06_001354_001397/global_frame_000037_t36.0.jpg
      - /data/datasets/fps_sampling_frames/fps_1/VIRAT_S_000201_06_001354_001397/global_frame_000043_t42.0.jpg
