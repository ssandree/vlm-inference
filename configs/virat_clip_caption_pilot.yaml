# Independent 3-second video inputs for the same five representative videos.
model: 30b
mode: default
generation:
  max_new_tokens: 512
  do_sample: false
  repetition_penalty: 1.05
video:
  fps: 2.0
  min_pixels: 4096
  max_pixels: 393216
  total_pixels: 33554432
prompt_file: ../prompts/virat_clip_caption_pilot.txt
output:
  dir: outputs/virat_clip_caption_pilot
  file: results.json
jobs:
  - name: stairs_pedestrians
    type: video
    path: /data/datasets/VIRAT/videos-01/VIRAT_S_010001_03_000537_000563.mp4
  - name: parking_lot_object_interaction
    type: video
    path: /data/datasets/VIRAT/videos-01/VIRAT_S_010106_05_000954_000996.mp4
  - name: distant_cyclist
    type: video
    path: /data/datasets/VIRAT/videos-01/VIRAT_S_010113_05_000776_000805.mp4
  - name: entrance_pedestrians
    type: video
    path: /data/datasets/VIRAT/videos-01/VIRAT_S_010208_09_000857_000886.mp4
  - name: vehicle_movement
    type: video
    path: /data/datasets/VIRAT/videos-04/VIRAT_S_040005_00_000003_000058.mp4
