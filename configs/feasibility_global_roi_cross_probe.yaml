model: 8b

generation:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.2
  no_repeat_ngram_size: 8

video:
  fps: 2.0
  min_pixels: 4096
  max_pixels: 262144
  total_pixels: 20971520

image:
  min_pixels: 4096
  max_pixels: 262144

mode: experiment

experiment:
  global_pattern: 'global_frame_(?P<frame>\d+)_t(?P<time>\d+(?:\.\d+)?)'
  roi_pattern: 'tube(?P<roi>\d+)_frame_(?P<frame>\d+)_t(?P<time>\d+(?:\.\d+)?)(?:_fps_\d+)?'
  global_label: '[Global] t={time}s'
  roi_label: '[ROI{roi}] t={time}s'
  input_order: global_anchor
  roi_frames: default
  global_insert_source: fps_1
  global_insert_dedup_eps: 0.5
  save_vlm_inputs: false
  centroid_motion:
    centroid_displacement_threshold: 0.02
    pad_sec: 0.5
    base_fps: 1.0
    high_fps: 2.0

prompt_file: prompts/frames_roi.txt

output:
  dir: outputs/global_roi_cross_probe
  file: feasibility_probe.json

experiments:
  - global_roi_video_start_roi_fixed_2fps

feasibility:
  method_prompts:
    global_roi_video_start_roi_fixed_2fps: prompts/frames_roi.txt
  videos:
    - VIRAT_S_000201_06_001354_001397
  datasets:
    video_root: /data/datasets/virat_9vid
    fps_0_25: /data/datasets/fps_sampling_frames/fps0_25
    fps_1: /data/datasets/fps_sampling_frames/fps_1
    fps_2: /data/datasets/fps_sampling_frames/fps_2
    proposed_roi: /data/datasets/proposed_ROI/gaptype5_fps1
    proposed_roi_w_fps: /data/datasets/proposed_ROI_w_fps/gaptype5_fps1
    single_motion_roi: /data/datasets/single_motion_ROI/fps1
    single_motion_roi_w_fps: /data/datasets/single_motion_ROI_w_fps/fps1
  tracks_root: /home/ssandree/motion-detector/outputs/stage3/3_roi_tube/vlm_9vid_tg0.35_tm0.35
  cache_file: outputs/global_roi_cross/feasibility_cache.json
  resume: true