# Probe: same 1fps JPEGs as full_1fps, but as one video clip (not stills).
# mode must be default so frames go through type=video, not experiment images.
# Prompt file is reused as-is.

model: 8b

generation:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.2

video:
  fps: 1.0
  min_pixels: 4096
  max_pixels: 262144
  total_pixels: 20971520

image:
  min_pixels: 4096
  max_pixels: 262144

mode: default

prompt_file: prompts/frames_full.txt

output:
  dir: outputs
  file: feasibility_results_full1fps_video_probe.json

jobs:
  - name: VIRAT_S_000201_02_000590_000623__full_1fps_video
    type: image_dir
    path: /data/datasets/fps_sampling_frames/fps_1/VIRAT_S_000201_02_000590_000623
    glob: "global_frame_*.jpg"
    prompt_file: prompts/frames_full.txt
