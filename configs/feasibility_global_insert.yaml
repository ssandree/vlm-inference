# ROI-anchored Full-frame insertion ablation.
# ROI crops stay at the current 1fps proposed sampling; only Global timestamps change.
#
# Conditions (also selectable with --global-insert):
#   start_only      Full-frame at each ROI start
#   start_end       Full-frame at each ROI start and end
#   start_mid_end   Full-frame at start, midpoint, and end
# Midpoint snaps to the nearest sampled Full-frame at (start+end)/2.

model: 8b

generation:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.2
  no_repeat_ngram_size: 8

video:
  fps: 2.0
  min_pixels: 4096
  max_pixels: 262144
  total_pixels: 20971520

image:
  min_pixels: 4096
  max_pixels: 262144

mode: experiment

experiment:
  global_pattern: 'global_frame_(?P<frame>\d+)_t(?P<time>\d+(?:\.\d+)?)'
  roi_pattern: 'tube(?P<roi>\d+)_frame_(?P<frame>\d+)_t(?P<time>\d+(?:\.\d+)?)(?:_fps_\d+)?'
  global_label: '[Global] t={time}s'
  roi_label: '[ROI{roi}] t={time}s'
  input_order: global_anchor
  roi_frames: default
  # Dedicated method names already encode the condition; leave null here.
  # Use --global-insert start_only|start_end|start_mid_end to run one condition.
  global_insert: null
  global_insert_source: fps_1
  global_insert_dedup_eps: 0.5
  save_vlm_inputs: true

prompt_file: prompts/frames_roi.txt

output:
  dir: outputs/global_insert_ablation
  file: feasibility_results_global_insert.json

experiments:
  - global_roi_start_only_proposed_multi_roi
  - global_roi_start_end_proposed_multi_roi
  - global_roi_start_mid_end_proposed_multi_roi

feasibility:
  method_prompts:
    global_roi_start_only_proposed_multi_roi: prompts/frames_roi.txt
    global_roi_start_end_proposed_multi_roi: prompts/frames_roi.txt
    global_roi_start_mid_end_proposed_multi_roi: prompts/frames_roi.txt
  videos:
    - VIRAT_S_000201_02_000590_000623
    - VIRAT_S_000200_01_000226_000268
    - VIRAT_S_000201_06_001354_001397
    - VIRAT_S_010003_08_000739_000778
    - VIRAT_S_010004_00_000064_000100
    - VIRAT_S_010106_05_000954_000996
    - VIRAT_S_010200_05_000658_000700
    - VIRAT_S_040000_02_000111_000145
    - VIRAT_S_050000_05_000696_000732
  datasets:
    video_root: /data/datasets/virat_9vid
    fps_0_25: /data/datasets/fps_sampling_frames/fps0_25
    fps_1: /data/datasets/fps_sampling_frames/fps_1
    fps_2: /data/datasets/fps_sampling_frames/fps_2
    proposed_roi: /data/datasets/proposed_ROI/gaptype5_fps1
    proposed_roi_w_fps: /data/datasets/proposed_ROI_w_fps/gaptype5_fps1
    single_motion_roi: /data/datasets/single_motion_ROI/fps1
    single_motion_roi_w_fps: /data/datasets/single_motion_ROI_w_fps/fps1
  tracks_root: /home/ssandree/motion-detector/outputs/stage3/3_roi_tube/vlm_9vid_tg0.35_tm0.35
  jpeg_quality: 95
  cache_file: outputs/global_insert_ablation/feasibility_cache.json
