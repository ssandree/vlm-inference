# Two-clip sampling probe. Prompts identical to feasibility.yaml.
# Videos: boarding miss (000201_02) + cart/dumpster miss (010106).

model: 8b

generation:
  max_new_tokens: 256
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.055

video:
  fps: 2.0
  min_pixels: 4096
  max_pixels: 262144
  total_pixels: 20971520

image:
  min_pixels: 4096
  max_pixels: 262144

mode: experiment

experiment:
  global_pattern: 'global_frame_(?P<frame>\d+)_t(?P<time>\d+(?:\.\d+)?)'
  roi_pattern: 'tube(?P<roi>\d+)_frame_(?P<frame>\d+)_t(?P<time>\d+(?:\.\d+)?)(?:_fps_\d+)?'
  global_label: '[Global] t={time}s'
  roi_label: '[ROI{roi}] t={time}s'
  input_order: global_anchor
  roi_frames: default

prompt_file: prompts/frames_roi.txt

output:
  dir: outputs
  file: feasibility_results_sampling_probe.json

experiments:
  - full_1fps
  - global_0.25fps_proposed_multi_roi
  - single_motion_roi_original
  - global_0.25fps_single_motion_roi

feasibility:
  method_prompts:
    full_1fps: prompts/frames_full.txt
    global_0.25fps_proposed_multi_roi: prompts/frames_roi.txt
    single_motion_roi_original: prompts/frames_roi.txt
    global_0.25fps_single_motion_roi: prompts/frames_roi.txt
  videos:
    - VIRAT_S_000201_02_000590_000623
    - VIRAT_S_010106_05_000954_000996
  datasets:
    video_root: /data/datasets/virat_9vid
    fps_0_25: /data/datasets/fps_sampling_frames/fps0_25
    fps_1: /data/datasets/fps_sampling_frames/fps_1
    fps_2: /data/datasets/fps_sampling_frames/fps_2
    proposed_roi: /data/datasets/proposed_ROI/gaptype5_fps1
    proposed_roi_w_fps: /data/datasets/proposed_ROI_w_fps/gaptype5_fps1
    single_motion_roi: /data/datasets/single_motion_ROI/fps1
    single_motion_roi_w_fps: /data/datasets/single_motion_ROI_w_fps/fps1
  tracks_root: /home/ssandree/motion-detector/outputs/stage3/3_roi_tube/vlm_9vid_tg0.35_tm0.35
  jpeg_quality: 95
  cache_file: outputs/feasibility_cache_sampling_probe.json
  resume: false
