# One-clip tight-crop probe: same proposed method, per-frame cell AABB ROI.
# Baseline lifetime crops stay in gaptype5_fps1; this only swaps ROI JPEG root.

model: 8b

generation:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.2
  no_repeat_ngram_size: 8

video:
  fps: 2.0
  min_pixels: 4096
  max_pixels: 262144
  total_pixels: 20971520

image:
  min_pixels: 4096
  max_pixels: 262144

mode: experiment

experiment:
  global_pattern: 'global_frame_(?P<frame>\d+)_t(?P<time>\d+(?:\.\d+)?)'
  roi_pattern: 'tube(?P<roi>\d+)_frame_(?P<frame>\d+)_t(?P<time>\d+(?:\.\d+)?)(?:_fps_\d+)?'
  global_label: '[Global] t={time}s'
  roi_label: '[ROI{roi}] t={time}s'
  input_order: global_anchor
  roi_frames: default

prompt_file: prompts/frames_roi.txt

output:
  dir: outputs
  file: feasibility_results_tight_probe_000200.json

experiments:
  - global_0.25fps_proposed_multi_roi

feasibility:
  method_prompts:
    global_0.25fps_proposed_multi_roi: prompts/frames_roi.txt
  videos:
    - VIRAT_S_000200_01_000226_000268
  datasets:
    video_root: /data/datasets/virat_9vid
    fps_0_25: /data/datasets/fps_sampling_frames/fps0_25
    fps_1: /data/datasets/fps_sampling_frames/fps_1
    fps_2: /data/datasets/fps_sampling_frames/fps_2
    proposed_roi: /data/datasets/proposed_ROI/gaptype5_fps1
    proposed_roi_w_fps: /data/datasets/proposed_ROI_w_fps/gaptype5_fps1_tight
    single_motion_roi: /data/datasets/single_motion_ROI/fps1
    single_motion_roi_w_fps: /data/datasets/single_motion_ROI_w_fps/fps1
  tracks_root: /home/ssandree/motion-detector/outputs/stage3/3_roi_tube/vlm_9vid_tg0.35_tm0.35
  jpeg_quality: 95
  cache_file: outputs/feasibility_cache_tight_probe_000200.json
  resume: false
