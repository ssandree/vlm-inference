# sample30 captioning: Qwen3-VL-30B-A3B, centroid-displacement ROI, start_only Global.
# ROI: 1 fps default, 2 fps around large centroid jumps.
# Global: one full-frame at each ROI tube start (snapped from 1 fps pool).

model: 30b

generation:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.2
  no_repeat_ngram_size: 8

video:
  fps: 2.0
  min_pixels: 4096
  max_pixels: 262144
  total_pixels: 20971520

image:
  min_pixels: 4096
  max_pixels: 262144

mode: experiment

experiment:
  global_pattern: 'global_frame_(?P<frame>\d+)_t(?P<time>\d+(?:\.\d+)?)'
  roi_pattern: 'tube(?P<roi>\d+)_frame_(?P<frame>\d+)_t(?P<time>\d+(?:\.\d+)?)(?:_fps_\d+)?'
  global_label: '[Global] t={time}s'
  roi_label: '[ROI{roi}] t={time}s'
  input_order: global_anchor
  roi_frames: default
  global_insert: start_only
  global_insert_source: fps_1
  global_insert_dedup_eps: 0.5
  roi_sampling: centroid_2fps
  roi_sampling_tau: 8.0
  roi_sampling_overwrite: false
  save_vlm_inputs: true
  centroid_motion:
    centroid_displacement_threshold: 0.02
    pad_sec: 0.5
    base_fps: 1.0
    high_fps: 2.0

prompt_file: prompts/frames_roi.txt

output:
  dir: outputs/sample30_30b_start_centroid
  file: feasibility_results_sample30_30b_start_centroid.json

experiments:
  - global_roi_start_only_roi_centroid_2fps

