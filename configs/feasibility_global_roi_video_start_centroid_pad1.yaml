# Video-start centroid screening: original settings, pad_sec=1.0 only.
model: 8b
generation:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.2
  no_repeat_ngram_size: 8
video:
  fps: 2.0
  min_pixels: 4096
  max_pixels: 262144
  total_pixels: 20971520
image:
  min_pixels: 4096
  max_pixels: 262144
mode: experiment
experiment:
  global_pattern: global_frame_(?P<frame>\d+)_t(?P<time>\d+(?:\.\d+)?)
  roi_pattern: tube(?P<roi>\d+)_frame_(?P<frame>\d+)_t(?P<time>\d+(?:\.\d+)?)(?:_fps_\d+)?
  global_label: '[Global] t={time}s'
  roi_label: '[ROI{roi}] t={time}s'
  input_order: global_anchor
  roi_frames: default
  global_insert: video_start
  global_insert_source: fps_1
  global_insert_dedup_eps: 0.5
  roi_sampling: null
  roi_sampling_tau: 8.0
  roi_sampling_overwrite: false
  save_vlm_inputs: true
  centroid_motion:
    centroid_displacement_threshold: 0.02
    pad_sec: 1.5
    base_fps: 1.0
    high_fps: 2.0
prompt_file: prompts/frames_roi.txt
output:
  dir: outputs/global_roi_video_start_centroid_pad1
  file: feasibility_results_global_roi_video_start_centroid_pad1.json
experiments:
- global_roi_video_start_roi_centroid_2fps
