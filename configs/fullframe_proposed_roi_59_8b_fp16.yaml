# 59 VIRAT clips x Qwen3-VL-8B float16 x 2 conditions.
# full_frame: 1 fps full-scene video.
# motion_roi: each tube is one [Global] frame at the ROI start, then that tube's 1 fps ROI video.

model: 8b-fp16

models:
  - 8b-fp16

videos_file: virat_multi_roi_59.txt

conditions:
  - full_frame
  - motion_roi

prompts:
  full_frame: prompts/frames_full.txt
  motion_roi: prompts/frames_roi_per_tube.txt

generation:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.2

video:
  fps: 1.0
  min_pixels: 4096
  max_pixels: 262144
  total_pixels: 20971520

image:
  min_pixels: 4096
  max_pixels: 262144

mode: default

output:
  dir: outputs/fullframe_proposed_roi_59_8b_fp16
  file: results.json
