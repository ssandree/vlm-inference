# Spatial-Temporal Input Configuration under a Fixed Visual Token Budget (Qwen3-VL-8B-Instruct)
experiment:
  name: spatial_temporal_budget_40960
  token_budget: 40960           # upper bound on image + all video visual tokens per VLM request
  fps: [0.5, 1.0, 2.0, 3.0, 4.0]
  spatial: [S0, S1, S2]
  sampling: uniform, t_k = window_start + k/fps < window_end; nearest decoded frame by PTS; same grid for every spatial condition
  timestamp_mode: source_timestamp      # absolute source PTS encoded into video metadata (frame_clock.encode_timestamps)
video:
  min_pixels: 4096
  max_pixels: 786432            # per-frame cap (applied)
  total_pixels: 41943040        # = 40960 * 32 * 32 ; enforced jointly across all videos of a request (+ image tokens)
